<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paper Trails</title>
  <meta name="description" content="Reading notes published from ReadXiv." />
  <script>
    (() => {
      const saved = localStorage.getItem('theme');
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="https://notapenguin.vercel.app/">Rishikesh Mallagundla</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </header>
  <main class="shell page">
    <header class="site-head">
      <h1 id="site-title">Paper Trails</h1>
      <p id="site-subtitle"></p>
    </header>
    <ul class="note-list" id="list">
      <li class="state">Loading…</li>
    </ul>
  </main>

  <script>
    function fmtDate(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function load() {
      const list = document.getElementById('list');
      let manifest;
      try {
        const res = await fetch('manifest.json?_=' + Date.now());
        manifest = await res.json();
      } catch (e) {
        list.innerHTML = '<li class="state">Could not load manifest.json.</li>';
        return;
      }

      if (manifest.site) {
        if (manifest.site.title) {
          document.getElementById('site-title').textContent = manifest.site.title;
          document.title = manifest.site.title;
        }
        if (manifest.site.subtitle) {
          document.getElementById('site-subtitle').textContent = manifest.site.subtitle;
        }
      }

      const notes = (manifest.notes || []).slice().sort((a, b) =>
        String(b.published_at || '').localeCompare(String(a.published_at || ''))
      );

      if (!notes.length) {
        list.innerHTML = '<li class="state">No notes published yet.</li>';
        return;
      }

      list.innerHTML = notes.map((n, idx) => {
        return (
          '<li style="--i:' + idx + '"><a href="note.html?id=' + encodeURIComponent(n.id) + '">' +
          '<time datetime="' + esc(n.published_at || '') + '">' + esc(fmtDate(n.published_at)) + '</time>' +
          '<span class="note-copy"><span class="nt">' + esc(n.title || n.id) + '</span>' +
          '<span class="meta">' + esc(n.authors || 'Author not listed') + '</span></span>' +
          '<span class="paper-id">' + esc(n.id) + '</span>' +
          '</a></li>'
        );
      }).join('');
    }

    load();
  </script>
  <script>
    document.querySelector('.theme-toggle')?.addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
